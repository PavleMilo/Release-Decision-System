<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Decision System</title>
    <link rel="stylesheet" href="/Frontend/style.css">
    <script src="/Frontend/TS/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Release Decision System</h1>
        <nav>
        </nav>
    </header>
    <main>
        <article id="parent-container">
            <form id="parent-sökväg">
                <input id="child-sökväg" placeholder="Skriv det du vill söka här... (för att söka id skriv i nummer annars är det timmar)">
                <button id="add-ticket-button" type="button">Lägg till ticket</button>
                <p id="release-decision"></p>

            </form>
            <section id="child-svar">
                <section id="release-decision-card" aria-live="polite">
                </section>
                <article id="parent-release-analysis">
                    <section id="child-release-analysis">
                    </section>
                </article>
                <section id="release-analysis-tickets">
                    <ul id="ticketHolder">

                    </ul>
                </section>
            </section>
        </article>
        <article id="parent-container-redigera" hidden>
            <div id="edit-background"></div>

            <section id="edit-window">
                <button id="back-button" type="button">Tillbaka</button>
                <div id="edit-content">

                </div>
            </section>
        </article>
    </main>
    <footer>
        <h3>NTI Södertörn. All rights reserved ©</h3>
    </footer>
</body>

</html>
